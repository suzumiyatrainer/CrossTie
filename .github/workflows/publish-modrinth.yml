name: Publish to Modrinth

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Download JAR from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "CrossTie-${RELEASE_TAG}.jar" --dir release-assets

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-id: "xrwNprGB"
          files: "release-assets/CrossTie-${{ github.event.release.tag_name }}.jar"
          name: "CrossTie ${{ github.event.release.tag_name }}"
          changelog: ${{ github.event.release.body }}
          version: ${{ github.event.release.tag_name }}
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          game-versions: "1.7.10"
          loaders: "forge"
          environment: "client | server"
          modrinth-dependencies: |
            unimixins:required
